<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Good Luck Saumya!</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <section id="slide1">
        <div class="content">
            <h1>You've Got This, Saumya! ✨</h1>
            <p>The smartest person in the room is about to walk in.</p>
            <button id="startBtn">Click for a Surprise</button>
        </div>
    </section>

    <section id="slide2">
        <img src="cat.png" alt="Custom Cat" id="cat-messenger">
        
        <div class="flower-container">
            <div class="bouquet-wrapper">
                <img src="rose.png" alt="Roses" class="flower" id="rose-img">
                <img src="lily.png" alt="Lilies" class="flower" id="lily-img">
            </div>
            <div id="final-message">
                <h2>Go Ace It! 💐</h2>
                <p>Sending you all the luck in the world.</p>
            </div>
        </div>
    </section>

    <script src="script.js"></script>
</body>
</html>
