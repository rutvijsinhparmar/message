<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Good Luck Saumya!</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <section id="slide1">
        <div class="content">
            <h1>You've Got This, Saumya! ✨</h1>
            <p>Go show them why you're the best.</p>
            <button id="startBtn">Click for a Surprise</button>
        </div>
    </section>

    <section id="slide2">
        <div id="bouquet-container">
            <img src="lily.png" class="flower lily" style="--i:1; --delay: 0s">
            <img src="lily.png" class="flower lily" style="--i:2; --delay: 0.5s">
            <img src="lily.png" class="flower lily" style="--i:3; --delay: 0.2s">
            <img src="lily.png" class="flower lily" style="--i:4; --delay: 0.8s">
            
            <img src="rose.png" class="flower rose" style="--i:5; --delay: 0.3s">
            <img src="rose.png" class="flower rose" style="--i:6; --delay: 0.1s">
            <img src="rose.png" class="flower rose" style="--i:7; --delay: 0.6s">
            <img src="rose.png" class="flower rose" style="--i:8; --delay: 0.4s">
            <img src="rose.png" class="flower rose" style="--i:9; --delay: 0.7s">
            <img src="rose.png" class="flower rose" style="--i:10; --delay: 0.9s">
        </div>

        <div id="final-message">
            <h2>Go Ace That Interview! 💐</h2>
            <p>A 10/10 bouquet for a 10/10 best friend.</p>
        </div>
    </section>

    <script src="script.js"></script>
</body>
</html>
