<!DOCTYPE html>
<html lang="en">

    <title>For Saumya ✨</title>

</head>

    <section id="slide1">

                <img src="rose.png" class="flower rose front-l">
                <img src="rose.png" class="flower rose front-r">

        </div>

        <div id="final-message">

            <p>A little piece of nature to bring you peace.</p>
        </div>
